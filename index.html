<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Artale 炎魔助手</title>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>

<div class="setting-box">
    <label>語音速度: <span id="rateValue">1.2</span>x</label><br>
    <input type="range" id="rateRange" min="0.5" max="2.0" step="0.1" value="1.2" oninput="updateRate(this.value)">
</div>

<div style="width:100%;max-width:400px;margin-bottom:15px;">
    <button
        class="btn"
        style="height:60px;background:#8e44ad;color:white;"
        onclick="location.href='horntail.html'">
        🐉 前往龍王助手
    </button>
</div>

<div class="card card-loop">
    <div id="loop-status" class="title water-color">下一階段：黑水</div>
    <div id="loop-timer" class="timer-display">40</div>
    
    <div style="display: flex; justify-content: center; align-items: center;">
        <button class="btn start-btn" id="loopBtn" onclick="startLoop()">
            開始 / 機制對齊重置
        </button>
        <span class="info-icon" data-tippy-content="進入本體階段時，<br />看到黑水或雙魔方出現那一刻點擊<br />(本體第三階段皆固定單魔方)，<br />可讓計時與機制完全同步。">ⓘ</span>
    </div>
    <!-- <div style="display: flex; gap: 8px; margin-bottom: 10px;"> -->
    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
        <button class="btn mode-btn" style="height: 60px; margin-bottom: 0;" onclick="toggleLoopMode()">🔄 調整提示機制 切換 黑水/魔方</button>
        <span class="info-icon" data-tippy-content="可調整下一個要提示的機制。">ⓘ</span>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
        <button class="btn delay-btn" style="height: 60px; margin-bottom: 0;" onclick="addLoopTime(10)">招喚怪物 +10秒延遲</button>
        <span class="info-icon" data-tippy-content="當提示通知時沒出現正確機制，<br />應為本體招換怪物，<br />點擊可增加10秒調整機制時間。">ⓘ</span>
    </div>
    <!-- </div> -->
    <button class="btn stop-btn" onclick="stopLoop()">停止計時</button>
</div>

<div class="card card-time">
    <div id="time-title" class="title" style="color:#feca57">時間魔方 (2:30)</div>
    <div id="time-timer" class="timer-display" style="color:#feca57">02:30</div>
    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
        <button class="btn start-btn" id="timeBtn" onclick="startTimeTimer()">
            開始 / 出生對齊
        </button>
        <span class="info-icon" data-tippy-content="開場招喚炎魔時點擊，<br />用於預測時間魔方。<br />(本體第三階段不適用)">ⓘ</span>
    </div>
    <button class="btn stop-btn" onclick="stopTimeTimer()">停止計時</button>
</div>

<div class="card card-smoke-time">
    <div id="smoke-status" class="title" style="color:#a5a5a5">煙霧彈計時器 (Lv.30)</div>
    <div id="smoke-timer" class="timer-display" style="color:#a5a5a5">60</div>

    <div id="smoke-ctrl">
        <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 15px; gap: 10px;">
            <label style="color: #fff;">等級:</label>
            <select id="smokeLevel" onchange="initSmoke()" style="padding: 5px 10px; border-radius: 8px; background: #333; color: #fff; border: 1px solid #666;">
                <script>
                    for(let i=1; i<=30; i++) {
                        document.write(`<option value="${i}" ${i==30?'selected':''}>Lv.${i}</option>`);
                    }
                </script>
            </select>
            <span class="info-icon" data-tippy-content="煙霧結束後將自動進入 10 分鐘 CD 倒數。">ⓘ</span>
        </div>
    </div>

    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
        <button class="btn start-btn" id="smokeBtn" onclick="startSmoke()">
            施放煙霧彈
        </button>
    </div>
    <button class="btn stop-btn" onclick="stopSmoke()">停止計時 / 重置</button>
</div>

<script src="https://unpkg.com/@popperjs/core@2"></script>
<script src="https://unpkg.com/tippy.js@6"></script>

<script>
    // 初始化 Tooltip
    tippy('[data-tippy-content]', {
        theme: 'material',
        // trigger: 'click', // 手機版建議點擊觸發
        placement: 'top',
        arrow: true,
        allowHTML: true,
    });

    // --- 以下為原始計時邏輯 ---
    let speechRate = 1.2;
    function updateRate(val) { speechRate = val; document.getElementById('rateValue').innerText = val; }

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-TW';
        msg.rate = speechRate;
        window.speechSynthesis.speak(msg);
    }

    function unlock() {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
    }

    let loopSeconds = 40;
    let loopInterval = null;
    let loopMode = "water";
    let loopSpoken10 = false, loopSpoken3 = false;

    function toggleLoopMode() {
        loopMode = (loopMode === "water" ? "cube" : "water");
        loopSpoken10 = false; loopSpoken3 = false;
        updateLoopUI();
    }

    function addLoopTime(sec) {
        loopSeconds += sec;
        loopSpoken10 = false; loopSpoken3 = false;
        updateLoopUI();
    }

    function startLoop() {
        unlock(); clearInterval(loopInterval);
        loopSeconds = 40; 
        loopSpoken10 = false; loopSpoken3 = false;
        document.getElementById('loopBtn').classList.add('active-loop');
        loopInterval = setInterval(() => {
            loopSeconds--;
            if (loopSeconds === 10 && !loopSpoken10) { speak(loopMode === "water" ? "十秒後黑水" : "十秒後雙魔方"); loopSpoken10 = true; }
            if (loopSeconds === 3 && !loopSpoken3) { speak(loopMode === "water" ? "黑水，黑水" : "雙魔方，雙魔方"); loopSpoken3 = true; }
            if (loopSeconds <= 0) { 
                loopMode = (loopMode === "water" ? "cube" : "water"); 
                loopSeconds = 40; loopSpoken10 = false; loopSpoken3 = false; 
            }
            updateLoopUI();
        }, 1000);
    }

    function stopLoop() {
        clearInterval(loopInterval);
        document.getElementById('loopBtn').classList.remove('active-loop');
        loopSeconds = 40; updateLoopUI();
    }

    function updateLoopUI() {
        const el = document.getElementById('loop-timer');
        const st = document.getElementById('loop-status');
        el.innerText = loopSeconds;
        st.innerText = loopMode === "water" ? "下一階段：黑水" : "下一階段：雙魔方";
        st.className = "title " + (loopMode === "water" ? "water-color" : "cube-color");
        loopSeconds <= 6 ? el.classList.add('blink') : el.classList.remove('blink');
    }

    let timeMax = 150;
    let timeSeconds = 150;
    let timeInterval = null;
    let timeSpoken10 = false, timeSpoken3 = false;

    function startTimeTimer() {
        unlock(); clearInterval(timeInterval);
        timeSeconds = timeMax;
        timeSpoken10 = false; timeSpoken3 = false;
        document.getElementById('timeBtn').classList.add('active-time');
        timeInterval = setInterval(() => {
            timeSeconds--;
            if (timeSeconds === 10 && !timeSpoken10) { speak("十秒後時間魔方"); timeSpoken10 = true; }
            if (timeSeconds === 3 && !timeSpoken3) { speak("時間魔方，時間魔方"); timeSpoken3 = true; }
            if (timeSeconds <= 0) { timeSeconds = timeMax; timeSpoken10 = false; timeSpoken3 = false; }
            updateTimeUI();
        }, 1000);
    }

    function stopTimeTimer() {
        clearInterval(timeInterval);
        document.getElementById('timeBtn').classList.remove('active-time');
        timeSeconds = timeMax; updateTimeUI();
    }

    function updateTimeUI() {
        const el = document.getElementById('time-timer');
        const m = Math.floor(timeSeconds / 60), s = timeSeconds % 60;
        el.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        timeSeconds <= 10 ? el.classList.add('blink') : el.classList.remove('blink');
    }
let smokeSeconds = 60;
    let smokeInterval = null;
    let isCDMode = false;
    let smokeSpoken10 = false, smokeSpoken3 = false, smokeSpokenCD = false;

    function initSmoke() {
        isCDMode = false;
        const level = parseInt(document.getElementById('smokeLevel').value);
        smokeSeconds = 30 + level;
        document.getElementById('smoke-status').innerText = `煙霧彈計時器 (Lv.${level})`;
        document.getElementById('smoke-status').className = "title";
        document.getElementById('smoke-timer').className = "timer-display";
        document.getElementById('smoke-ctrl').style.display = "block";
        updateSmokeUI();
    }

    function startSmoke() {
        unlock(); clearInterval(smokeInterval);
        isCDMode = false;
        const level = parseInt(document.getElementById('smokeLevel').value);
        smokeSeconds = 30 + level;
        smokeSpoken10 = false; smokeSpoken3 = false; smokeSpokenCD = false;
        
        document.getElementById('smokeBtn').classList.add('active-smoke');
        document.getElementById('smoke-ctrl').style.display = "none";
        speak("煙霧彈已施放");

        smokeInterval = setInterval(() => {
            smokeSeconds--;

            if (!isCDMode) {
                if (smokeSeconds === 10 && !smokeSpoken10) { speak("煙霧剩餘十秒"); smokeSpoken10 = true; }
                if (smokeSeconds === 3 && !smokeSpoken3) { speak("煙霧即將結束"); smokeSpoken3 = true; }
                
                if (smokeSeconds <= 0) {
                    isCDMode = true;
                    smokeSeconds = 600 - (30 + level);
                    speak("煙霧結束，開始冷卻十分鐘");
                    document.getElementById('smoke-status').innerText = "煙霧彈冷卻中 (CD)";
                    document.getElementById('smoke-status').classList.add('smoke-cd-color');
                    document.getElementById('smoke-timer').classList.add('smoke-cd-color');
                }
            } else {
                // --- CD 期間的邏輯 ---
                if (smokeSeconds === 60 && !smokeSpokenCD) { speak("煙霧彈冷卻剩餘一分鐘"); smokeSpokenCD = true; }
                if (smokeSeconds <= 0) {
                    speak("煙霧彈冷卻結束，可以再次施放");
                    stopSmoke();
                }
            }
            updateSmokeUI();
        }, 1000);
    }

    function stopSmoke() {
        clearInterval(smokeInterval);
        document.getElementById('smokeBtn').classList.remove('active-smoke');
        initSmoke();
    }

    function updateSmokeUI() {
        const el = document.getElementById('smoke-timer');
        if (!isCDMode) {
            el.innerText = smokeSeconds;
            smokeSeconds <= 5 ? el.classList.add('blink') : el.classList.remove('blink');
        } else {
            const m = Math.floor(smokeSeconds / 60);
            const s = smokeSeconds % 60;
            el.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            el.classList.remove('blink');
        }
    }

    window.addEventListener('load', initSmoke);
</script>
</body>
<footer>
    <p>© 2026 Steven | Artale Zakum Helper v1.0.6</p>
    <p>All rights reserved.</p>
</footer>
</html>
